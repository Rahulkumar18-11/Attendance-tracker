<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Student Attendance Tracker — Record daily attendance quickly and easily." />
  <title>Student Attendance Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar">
    <div class="navbar__brand">
      <div class="navbar__brand-icon">📋</div>
      <span>AttendanceTracker</span>
    </div>
    <div class="navbar__actions">
      <a href="index.html" class="navbar__link active">Student</a>
      <a href="admin.html" class="navbar__link">Admin</a>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    </div>
  </nav>

  <!-- ========== TOASTS ========== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="main">
    <header class="page-header animate-in">
      <h1 class="page-header__title">Mark Attendance</h1>
      <p class="page-header__subtitle">Enter your details below to record today's attendance</p>
    </header>

    <div class="card card--form animate-in">
      <form id="attendanceForm" autocomplete="off">
        <div class="form-group">
          <label for="studentName">Student Name</label>
          <input
            type="text"
            class="form-control"
            id="studentName"
            placeholder="e.g. Rahul Kumar"
            required
            autofocus
          />
        </div>

        <div class="form-group">
          <label for="attendanceDate">Date</label>
          <input
            type="date"
            class="form-control"
            id="attendanceDate"
            required
          />
        </div>

        <div class="form-group">
          <label for="attendanceStatus">Status</label>
          <select class="form-control" id="attendanceStatus" required>
            <option value="" disabled selected>Select status…</option>
            <option value="present">✅ Present</option>
            <option value="absent">❌ Absent</option>
            <option value="late">⏰ Late</option>
          </select>
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="submitBtn">
          📋 Submit Attendance
        </button>
      </form>
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    Student Attendance Tracker &copy; 2026 &mdash; Cloud Version
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
